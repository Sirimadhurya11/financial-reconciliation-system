<div class="login-container">

```
<h1>Financial Reconciliation</h1>

<div class="subtitle">
    Admin Login
</div>

<form id="loginForm">

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Enter username"
        required
    >

    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div id="message"></div>
```

</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent = "Logging in...";

        try {

            const response = await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })

            });

            const data = await response.json();

            if (!response.ok) {

                message.textContent =
                    data.detail || "Login failed";

                return;
            }

            /*
             * Save JWT token
             */
            localStorage.setItem(
                "access_token",
                data.access_token
            );

            localStorage.setItem(
                "username",
                data.username
            );

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            /*
             * Open dashboard
             */
            window.location.href =
                "/dashboard-page";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Cannot connect to server.";

        }

    });

</script>

</body>
</html>
